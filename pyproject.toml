[project]
name = "fdm-mcp"
version = "0.1.0"
description = "MCP server with six deterministic FDM print-planning tools (24-679 HW5)"
authors = [{ name = "Akshara N.S." }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fdm-mcp = "fdm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdm_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
